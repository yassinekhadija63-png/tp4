<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des commandes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Gestion des commandes</span>
    </div>
  </nav>

  <main class="container">

    <!-- Zone d'erreur : cachée tant qu'il n'y a pas d'erreur -->
    <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

    <!-- Indicateurs : remplis par JavaScript -->
    <section id="indicators" class="row g-3 mb-4"></section>

    <!-- Recherche et filtres -->
    <section class="card card-body mb-4">
      <div class="row g-3">
        <div class="col-md-4">
          <label for="search-input" class="form-label">Rechercher un client</label>
          <input type="text" id="search-input" class="form-control" placeholder="Ex : Nadia">
        </div>
        <div class="col-md-4">
          <label for="status-filter" class="form-label">Statut</label>
          <select id="status-filter" class="form-select">
            <option value="all">Tous les statuts</option>
            <option value="Livree">Livree</option>
            <option value="En attente">En attente</option>
            <option value="Annulee">Annulee</option>
          </select>
        </div>
        <div class="col-md-4">
          <label for="category-filter" class="form-label">Catégorie de produit</label>
          <select id="category-filter" class="form-select">
            <option value="all">Toutes les catégories</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Liste des commandes -->
    <section>
      <h2 class="h4">Commandes</h2>
      <div class="table-responsive">
        <table class="table table-striped table-hover bg-white align-middle">
          <thead class="table-dark">
            <tr>
              <th>N°</th>
              <th>Client</th>
              <th>Date</th>
              <th>Statut</th>
              <th>Total</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="orders-body"></tbody>
        </table>
      </div>
      <p id="no-result" class="text-muted fst-italic d-none">
        Aucune commande ne correspond à votre recherche.
      </p>
    </section>

  </main>

  <!-- Fenêtre (modal) du détail d'une commande -->
  <div class="modal fade" id="orderModal" tabindex="-1" aria-labelledby="orderModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="orderModalTitle">Détail de la commande</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body" id="order-detail"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
